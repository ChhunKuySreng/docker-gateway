# ==============================================================================
# OpenGraph Social Bot Preview Configuration for Nginx (NJS)
# ==============================================================================
# Include this file in your website's Nginx configuration.
#
# Prerequisite:
# - Ensure NJS module is loaded (load_module modules/ngx_http_js_module.so;)
# - Ensure og_preview.js is placed at /etc/nginx/og_preview.js
# ==============================================================================

# 1. Import the JavaScript module
js_import og_preview from /etc/nginx/og_preview.js;

# 2. Detect social media crawlers & bot user agents
map $http_user_agent $is_crawler {
    default 0;
    ~*(facebookexternalhit|telegrambot|whatsapp|twitterbot|linkedinbot|bingbot|googlebot|slackbot|discordbot|applebot) 1;
}

