# ==============================================================================
# Dynamic Social Media OpenGraph Preview Module
# Relates to: ./og_preview.js
# Generates dynamic OpenGraph metadata (og:title, og:image, og:description)
# when links are shared on Facebook, Telegram, WhatsApp, Twitter, LinkedIn.
# ==============================================================================
js_import og_preview from /etc/nginx/og_preview.js;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# ------------------------------------------------------------------------------
# Social Crawler User-Agent Detection (Relates to: ./og_preview.js)
# Identifies web crawlers from social platforms to serve dynamic OpenGraph meta tags
# ------------------------------------------------------------------------------
map $http_user_agent $is_crawler {
    default 0;
    ~*(facebookexternalhit|telegrambot|whatsapp|twitterbot|linkedinbot|bingbot|googlebot|slackbot|discordbot|applebot) 1;
}

map $http_referer $referer_app {
    ~*https?://[^/]+/(?<ref_proj>[a-zA-Z0-9_-]+)/? $ref_proj;
    default "";
}

server {
    listen 80;
    server_name _;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml;

    client_max_body_size 200M;
    absolute_redirect off;
    port_in_redirect off;

    # Internal Docker & public DNS resolvers (Relates to: ./og_preview.js API fetch)
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 ipv6=off valid=5s;
    js_fetch_verify off;
    js_fetch_timeout 5s;

    # Central Landing Page / Dashboard
    location = / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files /index.html =404;
    }

    # Allow all search bots and social media crawlers
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files /robots.txt =200;
    }

    # Gateway API data & Static Assets
    location ~ ^/(status\.json|api/) {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # phpMyAdmin Gateway Redirect
    location ^~ /phpmyadmin {
        return 301 https://local-db.tail7fda6b.ts.net/;
    }

    # Dynamic Routing to Per-Project Containers:
    # https://<your-app-domain>.ts.net/<contextName>/... -> http://app-<contextName>:80/<contextName>/...
    location ~ ^/(assets|static)/ {
        if ($referer_app != "") {
            proxy_pass http://app-$referer_app:80;
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ ^/(?<proj>[a-zA-Z0-9_-]+)(?<path>/.*)?$ {
        # ----------------------------------------------------------------------
        # Crawler Rewrite Rule (Relates to: ./og_preview.js)
        # Intercepts crawler visits to temple/activity paths and sends to NJS handler
        # ----------------------------------------------------------------------
        if ($is_crawler = 1) {
            rewrite ^/(?<proj_name>[a-zA-Z0-9_-]+)/(temple|activity|event|annual_event|community|museum|other|audio)/[^.]+$ /_njs_bot_preview last;
        }

        set $upstream_app http://app-$proj:80;

        proxy_pass $upstream_app$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Custom friendly error page when container is not found or starting
        proxy_intercept_errors on;
        error_page 502 503 504 = @app_not_running;
    }

    location @app_not_running {
        default_type text/html;
        return 502 '<!doctype html><html><head><meta charset="utf-8"><title>Project Not Running</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#f8fafc}.card{background:#1e293b;padding:2.5rem;border-radius:1rem;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-width:480px;text-align:center;border:1px solid #334155}h2{color:#38bdf8;margin-top:0}code{background:#0f172a;padding:0.2rem 0.5rem;border-radius:0.375rem;color:#f43f5e;font-size:0.95em}a{display:inline-block;margin-top:1.5rem;color:#38bdf8;text-decoration:none;font-weight:500}</style></head><body><div class="card"><h2>⚡ Project Container Not Running</h2><p>The container <code>app-$proj</code> has not been deployed yet or is stopped.</p><p style="color:#94a3b8;font-size:0.9rem">Run <code>dweb</code> or <code>deploy-web</code> inside your project directory to build and deploy its container.</p><a href="/">← Go to Central Dashboard</a></div></body></html>';
    }

    # --------------------------------------------------------------------------
    # NJS Bot Preview Handler (Relates to: ./og_preview.js)
    # Invokes handleBotPreview in og_preview.js to render HTML with og:* metadata
    # --------------------------------------------------------------------------
    location = /_njs_bot_preview {
        internal;
        js_content og_preview.handleBotPreview;
    }
}
