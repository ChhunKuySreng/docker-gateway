map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $cookie_dev_port $cookie_port {
    "~*(3[0-9]{3})" $1;
    default "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;
    absolute_redirect off;
    port_in_redirect off;

    # Internal Docker Host IP on macOS
    set $docker_host 192.168.65.254;

    # Hub page: /hub or /ports
    location ~ ^/(hub|ports)/?$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Realtime SSE stream from internal Node daemon
    location = /events {
        proxy_pass http://127.0.0.1:4000/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Projects REST API (status, rename)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
    }

    # Dynamic projects metadata
    location = /projects.json {
        proxy_pass http://127.0.0.1:4000/api/status;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Port activation endpoints: /3000/, /3001/, ..., /3999/
    # Sets cookie so browser stays at root / (fixing React Router & WebSocket HMR)
    location ~ "^/(?:port-)?(?<target_port>3[0-9]{3})/?$" {
        add_header Set-Cookie "dev_port=$target_port; Path=/; SameSite=Lax" always;
        return 302 $scheme://$http_host/;
    }

    # Clear cookie and return to Hub
    location = /reset {
        add_header Set-Cookie "dev_port=; Path=/; Max-Age=0; SameSite=Lax" always;
        return 302 $scheme://$http_host/hub;
    }

    # Root location: If cookie is set, proxy to active dev port; otherwise show Hub
    location = / {
        if ($cookie_port = "") {
            rewrite ^ /hub redirect;
        }

        proxy_pass http://$docker_host:$cookie_port/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @port_offline;
    }

    # Main proxy location handling all pages, assets, and WebSockets at root
    location / {
        set $effective_port $cookie_port;
        if ($effective_port = "") {
            set $effective_port "3000";
        }

        proxy_pass http://$docker_host:$effective_port$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (for Vite HMR, React Fast Refresh, Socket.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @port_offline;
    }

    location @port_offline {
        default_type text/html;
        return 502 '<!doctype html><html><head><meta charset="utf-8"><title>Port Offline</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#f8fafc}.card{background:#1e293b;padding:2.5rem;border-radius:1rem;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-width:480px;text-align:center;border:1px solid #334155}h2{color:#f43f5e;margin-top:0}code{background:#0f172a;padding:0.2rem 0.5rem;border-radius:0.375rem;color:#38bdf8;font-size:0.95em}a{display:inline-block;margin-top:1.5rem;color:#38bdf8;text-decoration:none;font-weight:500}</style></head><body><div class="card"><h2>🔌 Dev Server Not Running</h2><p>No active service found on the requested port on your Mac.</p><p style="color:#94a3b8;font-size:0.9rem">Make sure your project is running with <code>yarn start</code> or <code>npm run dev</code> on that port.</p><a href="/hub">← Go to Project Hub</a></div></body></html>';
    }
}
