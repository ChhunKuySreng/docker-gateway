<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Local Dev Gateway - Live Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #070a12;
      --surface: rgba(17, 24, 39, 0.75);
      --surface-elevated: #1f293d;
      --navbar-bg: rgba(7, 10, 18, 0.85);
      --border: rgba(31, 41, 61, 0.8);
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
      --input-bg: rgba(9, 13, 22, 0.85);
      --shadow-color: rgba(0, 0, 0, 0.5);
      --cyan: #38bdf8;
      --cyan-bg: rgba(56, 189, 248, 0.12);
      --cyan-border: rgba(56, 189, 248, 0.25);
      --purple: #c084fc;
      --purple-bg: rgba(168, 85, 247, 0.15);
      --purple-border: rgba(168, 85, 247, 0.3);
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --emerald-border: rgba(16, 185, 129, 0.25);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.12);
      --rose: #f43f5e;
      --title-gradient: linear-gradient(135deg, #ffffff 35%, #94a3b8 100%);
      --grid-dot: rgba(255, 255, 255, 0.07);
      --orb-opacity: 0.32;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-elevated: #f1f5f9;
      --navbar-bg: rgba(248, 250, 252, 0.88);
      --border: rgba(226, 232, 240, 0.9);
      --border-focus: #0284c7;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-dim: #94a3b8;
      --input-bg: rgba(248, 250, 252, 0.9);
      --shadow-color: rgba(0, 0, 0, 0.06);
      --cyan: #0284c7;
      --cyan-bg: rgba(2, 132, 199, 0.1);
      --cyan-border: rgba(2, 132, 199, 0.25);
      --purple: #9333ea;
      --purple-bg: rgba(147, 51, 234, 0.1);
      --purple-border: rgba(147, 51, 234, 0.25);
      --emerald: #059669;
      --emerald-bg: rgba(5, 150, 105, 0.1);
      --emerald-border: rgba(5, 150, 105, 0.25);
      --amber: #d97706;
      --amber-bg: rgba(217, 119, 6, 0.1);
      --rose: #e11d48;
      --title-gradient: linear-gradient(135deg, #0f172a 35%, #334155 100%);
      --grid-dot: rgba(15, 23, 42, 0.05);
      --orb-opacity: 0.18;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.4s ease, color 0.4s ease;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Aurora Glow Orbs */
    .bg-glow-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: var(--orb-opacity);
      will-change: transform;
      pointer-events: none;
      transition: opacity 0.4s ease;
      transform: translateZ(0);
    }
    .orb-1 {
      width: 580px; height: 580px;
      top: -100px; left: -80px;
      background: radial-gradient(circle, var(--cyan) 0%, rgba(56, 189, 248, 0) 70%);
      animation: driftOrb1 6s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 680px; height: 680px;
      top: 5%; right: -150px;
      background: radial-gradient(circle, var(--purple) 0%, rgba(168, 85, 247, 0) 70%);
      animation: driftOrb2 7.5s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 500px; height: 500px;
      bottom: 5%; left: 10%;
      background: radial-gradient(circle, var(--emerald) 0%, rgba(16, 185, 129, 0) 70%);
      animation: driftOrb3 5.5s ease-in-out infinite alternate;
    }

    @keyframes driftOrb1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-60px, 110px, 0) scale(1.08); }
    }
    @keyframes driftOrb2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-50px, -80px, 0) scale(1.15); }
    }
    @keyframes driftOrb3 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(50px, 90px, 0) scale(1.1); }
    }

    /* Ambient Tech Grid Overlay */
    .bg-grid-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* Sticky Navbar */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: var(--navbar-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px -4px var(--shadow-color);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .header-inner {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0.85rem clamp(1rem, 2.5vw, 2.5rem);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .navbar-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: clamp(1.15rem, 2.5vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--emerald-bg);
      border: 1px solid var(--emerald-border);
      padding: 0.28rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--emerald);
      white-space: nowrap;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px var(--shadow-color);
      white-space: nowrap;
    }
    .theme-toggle-btn:hover {
      background: var(--surface-elevated);
      transform: translateY(-1px);
    }

    .navbar-controls-row {
      display: flex;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.55rem 1rem 0.55rem 2.25rem;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.3s ease;
    }
    .search-input:focus {
      border-color: var(--border-focus);
    }
    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.88rem;
      pointer-events: none;
    }

    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }
    .stats-count {
      color: var(--emerald);
      font-family: var(--font-mono);
      font-weight: 700;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem clamp(1rem, 2.5vw, 2.5rem) 2.5rem;
      position: relative;
      z-index: 1;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.25rem 0 1.25rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-count {
      font-size: 0.75rem;
      background: var(--surface-elevated);
      padding: 0.18rem 0.6rem;
      border-radius: 9999px;
      color: var(--text-sub);
      font-family: var(--font-mono);
      font-weight: 600;
      border: 1px solid var(--border);
    }

    /* Card Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.15rem;
      padding: 1.25rem 1.35rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px -2px var(--shadow-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card-glow-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      opacity: 0;
      background: linear-gradient(90deg, var(--cyan), transparent);
      transition: opacity 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -4px var(--shadow-color);
      border-color: var(--cyan);
    }
    .card:hover .card-glow-bar {
      opacity: 1;
    }
    .card:active {
      transform: scale(0.99);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      gap: 0.6rem;
    }
    .card-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      background: var(--cyan-bg);
      border: 1px solid var(--cyan-border);
      flex-shrink: 0;
      box-shadow: 0 2px 6px var(--shadow-color);
    }

    .badges-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .port-pill {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid var(--purple-border);
      white-space: nowrap;
    }
    .card-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid var(--emerald-border);
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 6px var(--emerald);
    }

    .card-content {
      margin-bottom: 1.15rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.45rem;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-route {
      display: inline-block;
      max-width: 100%;
    }
    .card-route code {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.2rem 0.5rem;
      border-radius: 0.4rem;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--cyan-border);
      color: var(--cyan);
    }

    .card-footer {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
    }
    .launch-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--cyan);
      margin-left: auto;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4.5rem 1.5rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 1.15rem;
      backdrop-filter: blur(12px);
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.85;
    }
    .empty-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .empty-desc {
      color: var(--text-sub);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .empty-desc code {
      background: var(--cyan-bg);
      color: var(--cyan);
      padding: 0.2rem 0.45rem;
      border-radius: 0.35rem;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <!-- Animated Aurora Background -->
  <div class="bg-glow-container">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>
  <div class="bg-grid-overlay"></div>

  <!-- Sticky Navbar -->
  <header class="sticky-header">
    <div class="header-inner">
      <div class="navbar-top-row">
        <div class="brand-group">
          <div class="brand-title">🚀 Local Dev Gateway</div>
          <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span>LIVE</span>
          </div>
        </div>
        <div class="navbar-actions">
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <span>🌓</span>
            <span id="themeBtnText">Theme</span>
          </button>
        </div>
      </div>

      <div class="navbar-controls-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search active projects or ports...">
        </div>
        <div class="stats-badge">
          <span>Active:</span>
          <span class="stats-count" id="activeCount">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="section-header">
      <div class="section-title">
        <span>⚡ Active Projects</span>
        <span class="section-count" id="sectionCount">0</span>
      </div>
    </div>

    <div class="grid" id="projectGrid">
      <!-- Cards rendered live via SSE -->
    </div>
  </main>

  <script>
    let currentProjects = [];

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('gateway_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtnText(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('gateway_theme', next);
      updateThemeBtnText(next);
    }

    function updateThemeBtnText(theme) {
      const btnText = document.getElementById('themeBtnText');
      if (btnText) {
        btnText.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
      }
    }

    // Render cards matching gateway design
    function renderCards() {
      const grid = document.getElementById('projectGrid');
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      grid.innerHTML = '';

      const filtered = currentProjects.filter(p => {
        return p.name.toLowerCase().includes(query) || String(p.port).includes(query);
      });

      document.getElementById('activeCount').textContent = currentProjects.length;
      document.getElementById('sectionCount').textContent = currentProjects.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔌</div>
            <div class="empty-title">No Active Projects Detected</div>
            <div class="empty-desc">
              Start your dev server on your Mac (e.g. <code>yarn start</code> or <code>npm run dev</code>).
              It will automatically appear here in real-time.
            </div>
          </div>
        `;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `/${p.port}/`;
        card.innerHTML = `
          <div class="card-glow-bar"></div>
          <div class="card-top">
            <div class="card-icon-box">${p.icon || '⚡'}</div>
            <div class="badges-group">
              <span class="port-pill">:${p.port}</span>
              <span class="card-status-badge">
                <span class="status-dot"></span>
                <span>Online</span>
              </span>
            </div>
          </div>
          <div class="card-content">
            <div class="card-title" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>
            <div class="card-route"><code>/${p.port}/</code></div>
          </div>
          <div class="card-footer">
            <span>Port ${p.port}</span>
            <span class="launch-link">Launch App ↗</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Real-time SSE Connection
    function connectSSE() {
      const eventSource = new EventSource('/events');

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.projects) {
            currentProjects = data.projects;
            renderCards();
          }
        } catch (e) {
          console.error('SSE parse error:', e);
        }
      };

      eventSource.onerror = () => {
        eventSource.close();
        setTimeout(connectSSE, 2000);
      };
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    document.getElementById('searchInput').addEventListener('input', renderCards);

    initTheme();
    connectSSE();
  </script>
</body>
</html>
